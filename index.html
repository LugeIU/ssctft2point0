<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>💕 𝓷𝓰𝓾 𝓵ớ̥𝓶𝓶 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fcfcfb;--ink:#161616;--mut:#85857f;--line:#e4e4e0;--pos:#2f7a5a;--neg:#b4473e;--acc:#9a7b3f;--btn:#161616;--btnink:#fcfcfb}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f0e;--ink:#ecebe6;--mut:#8f8f88;--line:#2a2a27;--pos:#5fbf94;--neg:#e0796f;--acc:#c9a869;--btn:#ecebe6;--btnink:#0f0f0e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 Geist,Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{padding:56px 24px 24px;text-align:center}
h1{margin:0;font:400 clamp(36px,7vw,60px)/1.05 "Instrument Serif",Georgia,serif;font-style:normal;letter-spacing:-.01em}
h2{margin:0 0 14px;font:400 26px/1.2 "Instrument Serif",Georgia,serif}
#bar{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:18px}
main{max-width:1040px;margin:0 auto;padding:8px 24px 72px;display:grid;gap:48px}
section{border-top:1px solid var(--line);padding-top:24px}
button{font:500 14px Geist,Inter,sans-serif;color:var(--btnink);background:var(--btn);border:1px solid var(--btn);border-radius:4px;padding:7px 16px;cursor:pointer;transition:opacity .15s}
button:hover:not(:disabled){opacity:.8}
button.ghost{background:none;color:var(--ink);border-color:var(--line)}button.mini{padding:1px 8px;font-size:12px;margin-left:10px}
button:disabled{opacity:.3;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.between{justify-content:space-between}
.chip{background:none;color:var(--ink);border-color:var(--line)}.chip.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin:16px 0}
.team{border:1px solid var(--line);border-top:2px solid var(--c);padding:12px 14px}.team b{font:400 18px "Instrument Serif",Georgia,serif;color:var(--c)}
.team div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--mut);font-weight:500;font-size:13px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--bg)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mut)}.slider{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}.slide{flex:0 0 min(300px,82%);scroll-snap-align:start;border:1px solid var(--line);padding:28px 20px;color:var(--ink);text-decoration:none;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}.slide:hover{border-color:var(--ink)}.slide-name{font:400 26px "Instrument Serif",Georgia,serif}
details{border-bottom:1px solid var(--line);padding:12px 0}summary{cursor:pointer}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style></head><body>
<header><h1>💕 𝓷𝓰𝓾 𝓵ớ̥𝓶𝓶 💕</h1><div id="bar"></div></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="scoring.js"></script>
<script>
const SUPABASE_URL = 'https://fucmwydsvahpdyydfzfm.supabase.co', SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1Y213eWRzdmFocGR5eWRmemZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NzM1MDcsImV4cCI6MjEwODM0OTUwN30.WFwzqWjPlUN_zMKyHbtITAQFEwf4tYyzFfhykeb2xkQ';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const S = { players: [], games: [], sets: [], admin: false, role: null, pick: new Set(), touched: false, editing: null, wd: [], adding: false, sel: null };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n > 0 ? `<span class="pos">+${n}</span>` : n < 0 ? `<span class="neg">${n}</span>` : `<span class="mut">0</span>`;
const fail = r => { if (r.error) { alert(r.error.message); return true; } };
const pend = () => S.wd.filter(x => x.status === 'pending').length;
const live = () => S.games.filter(g => g.done && !g.settled);
const bal = p => +p.deposit + +p.pending - +p.withdraw + live().reduce((a, g) => a + (g.deltas[p.name] || 0), 0);

async function load() {
  const [p, g, s, w, a] = await Promise.all([db.from('players').select('*').order('name'), db.from('games').select('*').order('id'),
    db.from('settlements').select('*').order('id', { ascending: false }), db.from('withdrawals').select('*').order('id', { ascending: false }).limit(30), db.auth.getSession()]);
  S.players = p.data || []; S.games = g.data || []; S.sets = s.data || []; S.wd = w.data || [];
  S.role = a.data.session?.user?.app_metadata?.role || null; S.email = a.data.session?.user?.email || null; S.admin = S.role === 'admin';
  if (!S.touched) prefill();
  render();
}
const open = () => S.games.filter(g => !g.done), busy = () => open().flatMap(g => g.players);
function defName() { const u = open().map(g => g.name); let i = 1; while (u.includes('Lobby ' + i)) i++; return 'Lobby ' + i; }
function prefill() {  // pre-pick the roster of this lobby's last game, minus anyone playing elsewhere
  const done = S.games.filter(g => g.done).reverse(), last = done.find(g => g.name === defName()) || done[0], b = busy();
  S.pick = new Set(S.players.filter(x => last && last.players.includes(x.name) && !b.includes(x.name)).map(x => x.id));
}
async function login() {
  const email = prompt('Admin email'); if (!email) return;
  const password = prompt('Password'); if (!password) return;
  if (fail(await db.auth.signInWithPassword({ email, password }))) return;
  await load();
  if (!S.role) alert(`Logged in as ${email}, but this account has no role yet. Run schema_roles.sql in Supabase (with the right emails), then log out and log in again.`);
}
async function logout() {
  try { await db.auth.signOut({ scope: 'local' }); } catch (e) {}
  try { Object.keys(localStorage).filter(k => k.startsWith('sb-')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  location.reload();
}
async function addPlayer() {
  const name = $('np').value.trim(); if (!name) return;
  if (!fail(await db.from('players').insert({ name, pending: +$('nd').value || 0 }))) { S.adding = false; load(); }
}
async function withdraw(id) {
  const p = S.players.find(x => x.id === id), v = +prompt(`Withdraw how much for ${p.name}?`);
  if (!v || v <= 0) return;
  if (v > bal(p) && !confirm(`That is more than the balance (${bal(p)}). Continue?`)) return;
  if (S.admin) { if (!fail(await db.from('players').update({ withdraw: +p.withdraw + v }).eq('id', id))) load(); return; }
  if (!fail(await db.from('withdrawals').insert({ player_id: id, player_name: p.name, amount: v, requested_by: S.email }))) { alert('Request sent. The admin has to accept it.'); load(); }
}
async function deposit(id) {
  const p = S.players.find(x => x.id === id), v = +prompt(`Deposit how much for ${p.name}? (a negative number fixes a mistake)`);
  if (!v) return;
  if (!fail(await db.from('players').update({ pending: +p.pending + v }).eq('id', id))) load();
}
async function renamePlayer(id) {
  const p = S.players.find(x => x.id === id), v = prompt('New name for ' + p.name, p.name);
  if (!v || !v.trim() || v.trim() === p.name) return;
  if (!fail(await db.rpc('rename_player', { p_id: id, p_new: v.trim() }))) load();
}
function pick(id) { S.sel = S.sel === id ? null : id; render(); }
function toggleAdd() { S.adding = !S.adding; render(); }
async function decideWd(id, ok) {
  const x = S.wd.find(w => w.id === id); if (!x) return;
  const r = await db.from('withdrawals').update({ status: ok ? 'approved' : 'rejected', decided_at: new Date().toISOString() }).eq('id', id).eq('status', 'pending').select();
  if (fail(r)) return;
  if (ok && r.data.length) {
    const p = await db.from('players').select('withdraw').eq('id', x.player_id).single();
    if (fail(p) || fail(await db.from('players').update({ withdraw: +p.data.withdraw + +x.amount }).eq('id', x.player_id))) return;
  }
  load();
}
async function backup() {
  let url = localStorage.getItem('backupUrl');
  if (!url) { url = prompt('Paste the Google Apps Script Web app URL (ends with /exec)'); if (!url) return; localStorage.setItem('backupUrl', url.trim()); }
  const pad = (r, w) => { r = [...r]; while (r.length < w) r.push(''); return r; };
  const tab = (name, rs, n, extra) => {
    const w = 5 + n, head = ['Player', 'Deposit', 'Withdraw', 'Games', 'Balance', ...Array.from({ length: n }, (_, i) => 'G' + (i + 1))];
    return { name, values: [head, ...rs.map(r => pad([r.name, r.deposit, r.withdraw, r.played, r.bal, ...r.d.map(v => v == null ? '' : v)], w)), pad(extra, w)] };
  };
  const tabs = [tab('Scoreboard', rows(), live().length, ['Backed up', new Date().toLocaleString('vi-VN')])];
  S.sets.slice().reverse().forEach((s, i) => tabs.push(tab(`Settlement ${i + 1} (${s.created_at.slice(0, 10)})`, s.snapshot.players, s.snapshot.n, ['Jar', s.snapshot.jar])));
  try { await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ tabs }) }); alert('Backup sent. Open your Google Sheet to check it.'); }
  catch (e) { alert('Could not reach the backup link: ' + e.message); }
}
function resetBackup() { localStorage.removeItem('backupUrl'); alert('Backup link cleared. Press Backup to paste a new one.'); }
function requests() {
  if (!S.role) return '';
  const pd = S.wd.filter(x => x.status === 'pending'), dn = S.wd.filter(x => x.status !== 'pending').slice(0, 5);
  if (!pd.length && !dn.length) return '';
  const li = x => `<div class="row between" style="padding:6px 0"><span>${esc(x.player_name)} · <b>${+x.amount}</b> <span class="mut">(asked by ${esc(x.requested_by || 'admin')})</span></span>
    ${S.admin ? `<span class="row"><button onclick="decideWd(${x.id}, true)">Accept</button><button class="ghost" onclick="decideWd(${x.id}, false)">Reject</button></span>` : '<span class="mut">waiting for admin</span>'}</div>`;
  return `<section><h2>Withdrawal requests</h2>${pd.map(li).join('') || '<p class="mut">No pending requests.</p>'}
    ${dn.map(x => `<div class="mut">${x.status === 'approved' ? '✓ accepted' : '✕ rejected'}: ${esc(x.player_name)} ${+x.amount}</div>`).join('')}</section>`;
}
function toggle(id) { S.touched = true; S.pick.has(id) ? S.pick.delete(id) : S.pick.add(id); render(); }
function clearPick() { S.touched = true; S.pick.clear(); render(); }
async function createLobby() {
  const names = S.players.filter(p => S.pick.has(p.id)).map(p => p.name), name = $('ln').value.trim() || defName();
  S.touched = false;
  if (!fail(await db.from('games').insert({ players: names, name }))) load();
}
async function randomTeams(id) {
  const a = [...S.games.find(g => g.id === id).players];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (!fail(await db.from('games').update({ teams: [[a[0], a[1]], [a[2], a[3]], [a[4], a[5]], [a[6], a[7]]] }).eq('id', id))) load();
}
async function saveResults(id) {
  const g = S.games.find(x => x.id === id), places = {};
  document.querySelectorAll(`#lb${id} select[data-n]`).forEach(s => places[s.dataset.n] = +s.value);
  if (Object.values(places).includes(0)) return alert('Give every player a placement from 1 to 8.');
  const r = settle(g.teams, places);
  if (!fail(await db.from('games').update({ places, deltas: r.deltas, jar: r.jar, done: true }).eq('id', id))) { await db.rpc('fold_pending'); load(); }
}
async function cancelLobby(id) { if (confirm('Delete this lobby?') && !fail(await db.from('games').delete().eq('id', id))) load(); }
async function closePeriod() {
  const gs = live(); if (!gs.length) return alert('No games to settle yet.');
  if (!confirm('Settle the sheet? All G columns move to History and balances carry over.')) return;
  const snap = { n: gs.length, jar: gs.reduce((a, g) => a + +g.jar, 0), players: rows() };
  if (fail(await db.from('settlements').insert({ snapshot: snap }))) return;
  if (fail(await db.from('games').update({ settled: true }).eq('done', true).eq('settled', false))) return;
  await Promise.all(S.players.map(p => db.from('players').update({ deposit: bal(p), pending: 0, withdraw: 0 }).eq('id', p.id)));
  load();
}
function sync(L) {  // each placement can only be used once, per lobby
  const sel = [...document.querySelectorAll(`#lb${L} select[data-n]`)], used = sel.map(s => s.value);
  sel.forEach(s => [...s.options].forEach(o => { o.hidden = o.disabled = o.value !== '0' && o.value !== s.value && used.includes(o.value); }));
}
const COL = ['#9a7b3f', '#4f6d7a', '#5f7f5f', '#7a5a78'];
function openEdit(id) { S.editing = id; render(); document.getElementById('lbe' + id)?.scrollIntoView({ behavior: 'smooth' }); }
function cancelEdit() { S.editing = null; render(); }
async function saveEdit(id) {
  const g = S.games.find(x => x.id === id), places = {};
  document.querySelectorAll(`#lbe${id} select[data-n]`).forEach(s => places[s.dataset.n] = +s.value);
  if (Object.values(places).includes(0)) return alert('Give every player a placement from 1 to 8.');
  const r = settle(g.teams, places);
  if (!fail(await db.from('games').update({ places, deltas: r.deltas, jar: r.jar }).eq('id', id))) { S.editing = null; load(); }
}
function editCard(g) {
  const L = 'e' + g.id, n = live().findIndex(x => x.id === g.id) + 1;
  const sel = p => `<select data-n="${esc(p)}" data-l="${L}" onchange="sync('${L}')"><option value="0">-</option>${[1,2,3,4,5,6,7,8].map(i => `<option ${g.places[p] === i ? 'selected' : ''}>${i}</option>`).join('')}</select>`;
  const teams = g.teams.map((t, i) => `<div class="team" style="--c:${COL[i]}"><b>Team ${i + 1}</b>${t.map(p => `<div>${esc(p)} ${sel(p)}</div>`).join('')}</div>`).join('');
  return `<section id="lb${L}"><h2>Edit G${n}${g.name ? ' · ' + esc(g.name) : ''}</h2><div class="teams">${teams}</div>
    <div class="row"><button onclick="saveEdit(${g.id})">Save changes</button><button class="ghost" onclick="cancelEdit()">Cancel</button></div></section>`;
}
function lobbyCard(g) {
  const st = !!S.role, ad = S.admin, L = g.id;
  const sel = n => `<select data-n="${esc(n)}" data-l="${L}" onchange="sync(${L})"><option value="0">-</option>${[1,2,3,4,5,6,7,8].map(i => `<option>${i}</option>`).join('')}</select>`;
  const body = g.teams
    ? `<div class="teams">${g.teams.map((t, i) => `<div class="team" style="--c:${COL[i]}"><b>Team ${i + 1}</b>${t.map(n => `<div>${esc(n)} ${st ? sel(n) : ''}</div>`).join('')}</div>`).join('')}</div>`
    : `<p>${g.players.map(esc).join(', ')}</p>`;
  const btns = st ? `<div class="row"><button onclick="randomTeams(${L})">${g.teams ? 'Re-roll teams' : 'Random teams'}</button>
    <button ${g.teams ? '' : 'disabled'} onclick="saveResults(${L})">Save results</button><button class="ghost" onclick="cancelLobby(${L})">Delete lobby</button></div>` : '';
  return `<section id="lb${L}"><h2>${esc(g.name || 'Lobby')}</h2>${body}${btns}</section>`;
}
function newLobby() {
  if (!S.role) return '';
  const b = busy(), chips = S.players.map(p => `<button class="chip ${S.pick.has(p.id) ? 'on' : ''}" ${b.includes(p.name) ? 'disabled' : ''} onclick="toggle(${p.id})">${esc(p.name)}</button>`).join('');
  return `<section><h2>New lobby</h2><p class="mut">Players from this lobby's last game are already picked. Players in another lobby are greyed out (${S.pick.size}/8).</p>
    <div class="row"><input id="ln" value="${defName()}" aria-label="Lobby name"></div><div class="row" style="margin:12px 0">${chips}</div>
    <p class="row"><button ${S.pick.size === 8 ? '' : 'disabled'} onclick="createLobby()">Create lobby</button><button class="ghost" onclick="clearPick()">Clear</button></p></section>`;
}
function lobbies() {
  const o = open();
  return (S.role && S.editing && live().some(g => g.id === S.editing) ? editCard(live().find(g => g.id === S.editing)) : '') + (o.length ? o.map(lobbyCard).join('') : (S.role ? '' : `<section><h2>Lobby</h2><p class="mut">No game in progress.</p></section>`)) + newLobby();
}
function rows() {
  const gs = live();
  return S.players.map(p => { const d = gs.map(g => g.deltas[p.name]);
    return { id: p.id, name: p.name, deposit: +p.pending, withdraw: +p.withdraw, played: d.filter(v => v !== undefined).length, bal: bal(p), d }; });
}
function tbl(rs, n, ad, ids) {
  const th = Array.from({ length: n }, (_, i) => ids ? `<th onclick="openEdit(${ids[i]})">G${i + 1}</th>` : `<th>G${i + 1}</th>`).join('');
  const tr = rs.map(r => `<tr><td ${ad ? `onclick="pick(${r.id})"` : ''}>${esc(r.name)}</td><td>${r.deposit}</td>
    <td>${r.withdraw || ''}</td><td>${r.played}</td><td><b>${r.bal}</b></td>
    ${r.d.map(v => `<td>${v == null ? '' : fmt(v)}</td>`).join('')}</tr>`).join('');
  return `<div class="wrap"><table><thead><tr><th>Player</th><th>Deposit</th><th>Withdraw</th><th>Games</th><th>Balance</th>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}
function sheet() {
  const ad = S.admin, st = !!S.role;
  const sp = st && S.sel ? S.players.find(x => x.id === S.sel) : null;
  const panel = sp ? `<div class="row" style="margin:12px 0"><b>${esc(sp.name)}</b><button onclick="deposit(${sp.id})">Deposit</button><button onclick="withdraw(${sp.id})">Withdraw</button><button class="ghost" onclick="renamePlayer(${sp.id})">Rename</button><button class="ghost" onclick="pick(null)">Close</button></div>` : '';
  const add = st ? `<div class="row" style="margin-top:12px">${S.adding ? `<input id="np" placeholder="Player name"><input id="nd" type="number" placeholder="Deposit"><button onclick="addPlayer()">Add</button><button class="ghost" onclick="toggleAdd()">Cancel</button>` : `<button onclick="toggleAdd()">Add player</button>`}</div>` : '';
  return `<section><div class="row between"><h2>Scoreboard</h2>${ad ? `<span class="row"><button class="ghost" onclick="backup()">Backup to Google Sheet</button><button class="ghost" onclick="resetBackup()">Backup link</button><button onclick="closePeriod()">Settle sheet</button></span>` : ''}</div>${panel}${tbl(rows(), live().length, st, S.role ? live().map(g => g.id) : null)}${add}</section>`;
}
function history() {
  if (!S.sets.length) return '';
  const items = S.sets.map((s, i) => `<details><summary>Settlement #${S.sets.length - i} · ${new Date(s.created_at).toLocaleDateString('vi-VN')} · ${s.snapshot.n} games · jar ${s.snapshot.jar}</summary>${tbl(s.snapshot.players, s.snapshot.n, false)}</details>`).join('');
  return `<section><h2>History</h2>${items}</section>`;
}
const CHANNELS = [
  { name: 'yby1', site: 'YouTube', url: 'https://www.youtube.com/@YBY1TFT' },
  { name: 'wasianiverson', site: 'Twitch', url: 'https://www.twitch.tv/wasianiverson' },
  { name: 'midfeed', site: 'YouTube', url: 'https://www.youtube.com/@midfeedsobad' },
];
function channels() {
  return `<section><h2>đầu trâu thì vào đây</h2><div class="slider">${CHANNELS.map(c => `<a class="slide" href="${c.url}" target="_blank" rel="noopener"><span class="slide-name">${esc(c.name)}</span><span class="mut">${c.site}</span></a>`).join('')}</div></section>`;
}
function render() {
  const keep = {}, inp = {};
  document.querySelectorAll('select[data-n]').forEach(s => keep[s.dataset.l + '|' + s.dataset.n] = s.value);
  ['np', 'nd', 'ln'].forEach(i => { if ($(i)) inp[i] = $(i).value; });
  $('bar').innerHTML = S.role ? `<span class="mut">${S.role === 'admin' ? 'Admin' : 'Host'}</span>${S.admin && pend() ? `<span class="neg">🔔 ${pend()} withdrawal request(s)</span>` : ''}<button class="ghost" onclick="logout()">Log out</button>` : S.email ? `<span class="neg">${esc(S.email)}: no role yet</span><button class="ghost" onclick="logout()">Log out</button>` : `<button class="ghost" onclick="login()">Staff login</button>`;
  $('app').innerHTML = requests() + lobbies() + sheet() + history() + channels();
  document.querySelectorAll('select[data-n]').forEach(s => { const v = keep[s.dataset.l + '|' + s.dataset.n]; if (v) s.value = v; });
  Object.entries(inp).forEach(([i, v]) => { if ($(i) && v) $(i).value = v; });
  open().forEach(g => sync(g.id));
  if (S.editing) sync('e' + S.editing);
}
load(); setInterval(load, 10000);
</script></body></html>
