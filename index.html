<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>et et si tai ep tai</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fcfcfb;--ink:#161616;--mut:#85857f;--line:#e4e4e0;--pos:#2f7a5a;--neg:#b4473e;--acc:#9a7b3f;--btn:#161616;--btnink:#fcfcfb}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f0e;--ink:#ecebe6;--mut:#8f8f88;--line:#2a2a27;--pos:#5fbf94;--neg:#e0796f;--acc:#c9a869;--btn:#ecebe6;--btnink:#0f0f0e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 Geist,Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{padding:56px 24px 24px;text-align:center}
h1{margin:0;font:400 clamp(36px,7vw,60px)/1.05 "Instrument Serif",Georgia,serif;font-style:italic;letter-spacing:-.01em}
h2{margin:0 0 14px;font:400 26px/1.2 "Instrument Serif",Georgia,serif}
#bar{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:18px}
main{max-width:1040px;margin:0 auto;padding:8px 24px 72px;display:grid;gap:48px}
section{border-top:1px solid var(--line);padding-top:24px}
button{font:500 14px Geist,Inter,sans-serif;color:var(--btnink);background:var(--btn);border:1px solid var(--btn);border-radius:4px;padding:7px 16px;cursor:pointer;transition:opacity .15s}
button:hover:not(:disabled){opacity:.8}
button.ghost{background:none;color:var(--ink);border-color:var(--line)}button.mini{padding:1px 8px;font-size:12px;margin-left:10px}
button:disabled{opacity:.3;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.between{justify-content:space-between}
.chip{background:none;color:var(--ink);border-color:var(--line)}.chip.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin:16px 0}
.team{border:1px solid var(--line);border-top:2px solid var(--c);padding:12px 14px}.team b{font:400 18px "Instrument Serif",Georgia,serif;color:var(--c)}
.team div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--mut);font-weight:500;font-size:13px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--bg)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mut)}td.edit{cursor:pointer;text-decoration:underline dotted var(--mut)}
details{border-bottom:1px solid var(--line);padding:12px 0}summary{cursor:pointer}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style></head><body>
<header><h1>et et si tai ep tai</h1><div id="bar"></div></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="scoring.js"></script>
<script>
const SUPABASE_URL = 'https://fucmwydsvahpdyydfzfm.supabase.co', SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1Y213eWRzdmFocGR5eWRmemZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NzM1MDcsImV4cCI6MjEwODM0OTUwN30.WFwzqWjPlUN_zMKyHbtITAQFEwf4tYyzFfhykeb2xkQ';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const S = { players: [], games: [], sets: [], admin: false, pick: new Set(), touched: false };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n > 0 ? `<span class="pos">+${n}</span>` : n < 0 ? `<span class="neg">${n}</span>` : `<span class="mut">0</span>`;
const fail = r => { if (r.error) { alert(r.error.message); return true; } };
const live = () => S.games.filter(g => g.done && !g.settled);
const bal = p => +p.deposit - +p.withdraw + live().reduce((a, g) => a + (g.deltas[p.name] || 0), 0);

async function load() {
  const [p, g, s, a] = await Promise.all([db.from('players').select('*').order('name'), db.from('games').select('*').order('id'),
    db.from('settlements').select('*').order('id', { ascending: false }), db.auth.getSession()]);
  S.players = p.data || []; S.games = g.data || []; S.sets = s.data || []; S.admin = !!a.data.session;
  const last = S.games[S.games.length - 1];  // pre-pick the same 8 as the last game
  if (!S.touched && last) S.pick = new Set(S.players.filter(x => last.players.includes(x.name)).map(x => x.id));
  render();
}
async function login() {
  const email = prompt('Admin email'); if (!email) return;
  const password = prompt('Password'); if (!password) return;
  if (!fail(await db.auth.signInWithPassword({ email, password }))) load();
}
async function logout() { await db.auth.signOut(); load(); }
async function addPlayer() {
  const name = $('np').value.trim(); if (!name) return;
  if (!fail(await db.from('players').insert({ name, deposit: +$('nd').value || 0 }))) load();
}
async function editDeposit(id) {
  const v = prompt('New deposit amount'); if (v === null || v === '' || isNaN(+v)) return;
  if (!fail(await db.from('players').update({ deposit: +v }).eq('id', id))) load();
}
async function withdraw(id) {
  const p = S.players.find(x => x.id === id), v = +prompt(`Withdraw how much for ${p.name}?`);
  if (!v || v <= 0) return;
  if (v > bal(p) && !confirm(`That is more than the balance (${bal(p)}). Continue?`)) return;
  if (!fail(await db.from('players').update({ withdraw: +p.withdraw + v }).eq('id', id))) load();
}
function toggle(id) { S.touched = true; S.pick.has(id) ? S.pick.delete(id) : S.pick.add(id); render(); }
function clearPick() { S.touched = true; S.pick.clear(); render(); }
async function createLobby() {
  const names = S.players.filter(p => S.pick.has(p.id)).map(p => p.name);
  S.touched = false;
  if (!fail(await db.from('games').insert({ players: names }))) load();
}
async function randomTeams(id) {
  const a = [...S.games.find(g => g.id === id).players];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (!fail(await db.from('games').update({ teams: [[a[0], a[1]], [a[2], a[3]], [a[4], a[5]], [a[6], a[7]]] }).eq('id', id))) load();
}
async function saveResults(id) {
  const g = S.games.find(x => x.id === id), places = {};
  document.querySelectorAll('select[data-n]').forEach(s => places[s.dataset.n] = +s.value);
  if (Object.values(places).includes(0)) return alert('Give every player a placement from 1 to 8.');
  const r = settle(g.teams, places);
  if (!fail(await db.from('games').update({ places, deltas: r.deltas, jar: r.jar, done: true }).eq('id', id))) load();
}
async function cancelLobby(id) { if (confirm('Delete this lobby?') && !fail(await db.from('games').delete().eq('id', id))) load(); }
async function closePeriod() {
  const gs = live(); if (!gs.length) return alert('No games to settle yet.');
  if (!confirm('Settle the sheet? All G columns move to History and balances carry over.')) return;
  const snap = { n: gs.length, jar: gs.reduce((a, g) => a + +g.jar, 0), players: rows() };
  if (fail(await db.from('settlements').insert({ snapshot: snap }))) return;
  if (fail(await db.from('games').update({ settled: true }).eq('done', true).eq('settled', false))) return;
  await Promise.all(S.players.map(p => db.from('players').update({ deposit: bal(p), withdraw: 0 }).eq('id', p.id)));
  load();
}
function sync() {  // each placement can only be used once
  const sel = [...document.querySelectorAll('select[data-n]')], used = sel.map(s => s.value);
  sel.forEach(s => [...s.options].forEach(o => { o.hidden = o.disabled = o.value !== '0' && o.value !== s.value && used.includes(o.value); }));
}
const COL = ['#9a7b3f', '#4f6d7a', '#5f7f5f', '#7a5a78'];
function lobby() {
  const g = S.games.find(x => !x.done), ad = S.admin;
  if (!g) {
    if (!ad) return `<section><h2>Lobby</h2><p class="mut">No game in progress.</p></section>`;
    const chips = S.players.map(p => `<button class="chip ${S.pick.has(p.id) ? 'on' : ''}" onclick="toggle(${p.id})">${esc(p.name)}</button>`).join('');
    return `<section><h2>New lobby</h2><p class="mut">The players from the last game are already picked. Tap a name to swap anyone (${S.pick.size}/8).</p>
      <div class="row">${chips}</div><p class="row"><button ${S.pick.size === 8 ? '' : 'disabled'} onclick="createLobby()">Create lobby</button><button class="ghost" onclick="clearPick()">Clear</button></p></section>`;
  }
  const sel = n => `<select data-n="${esc(n)}" onchange="sync()"><option value="0">-</option>${[1,2,3,4,5,6,7,8].map(i => `<option>${i}</option>`).join('')}</select>`;
  const body = g.teams
    ? `<div class="teams">${g.teams.map((t, i) => `<div class="team" style="--c:${COL[i]}"><b>Team ${i + 1}</b>${t.map(n => `<div>${esc(n)} ${ad ? sel(n) : ''}</div>`).join('')}</div>`).join('')}</div>`
    : `<p>${g.players.map(esc).join(', ')}</p>`;
  const btns = ad ? `<div class="row"><button onclick="randomTeams(${g.id})">${g.teams ? 'Re-roll teams' : 'Random teams'}</button>
    <button ${g.teams ? '' : 'disabled'} onclick="saveResults(${g.id})">Save results</button><button class="ghost" onclick="cancelLobby(${g.id})">Delete lobby</button></div>` : '';
  return `<section><h2>Lobby in progress</h2>${body}${btns}</section>`;
}
function rows() {
  const gs = live();
  return S.players.map(p => { const d = gs.map(g => g.deltas[p.name]);
    return { id: p.id, name: p.name, deposit: +p.deposit, withdraw: +p.withdraw, played: d.filter(v => v !== undefined).length, bal: bal(p), d }; });
}
function tbl(rs, n, ad) {
  const th = Array.from({ length: n }, (_, i) => `<th>G${i + 1}</th>`).join('');
  const tr = rs.map(r => `<tr><td>${esc(r.name)}</td><td ${ad ? `class="edit" onclick="editDeposit(${r.id})"` : ''}>${r.deposit}</td>
    <td>${r.withdraw || ''}${ad ? `<button class="mini" onclick="withdraw(${r.id})">Withdraw</button>` : ''}</td><td>${r.played}</td><td><b>${r.bal}</b></td>
    ${r.d.map(v => `<td>${v == null ? '' : fmt(v)}</td>`).join('')}</tr>`).join('');
  return `<div class="wrap"><table><thead><tr><th>Player</th><th>Deposit</th><th>Withdraw</th><th>Games</th><th>Balance</th>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}
function sheet() {
  const ad = S.admin;
  const add = ad ? `<div class="row" style="margin-top:12px"><input id="np" placeholder="Player name"><input id="nd" type="number" placeholder="Deposit"><button onclick="addPlayer()">Add player</button></div>` : '';
  return `<section><div class="row between"><h2>Scoreboard</h2>${ad ? `<button onclick="closePeriod()">Settle sheet</button>` : ''}</div>${tbl(rows(), live().length, ad)}${add}</section>`;
}
function history() {
  if (!S.sets.length) return '';
  const items = S.sets.map((s, i) => `<details><summary>Settlement #${S.sets.length - i} · ${new Date(s.created_at).toLocaleDateString('vi-VN')} · ${s.snapshot.n} games · jar ${s.snapshot.jar}</summary>${tbl(s.snapshot.players, s.snapshot.n, false)}</details>`).join('');
  return `<section><h2>History</h2>${items}</section>`;
}
function render() {
  $('bar').innerHTML = S.admin ? `<span class="mut">Admin</span><button class="ghost" onclick="logout()">Log out</button>` : `<button class="ghost" onclick="login()">Admin login</button>`;
  $('app').innerHTML = lobby() + sheet() + history(); sync();
}
load(); setInterval(() => { if (!S.admin) load(); }, 15000);
</script></body></html>
